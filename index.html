<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>服装设计填色 · 面料·蕾丝·皮草</title>
<style>
:root{--bg:#efeae2;--ink:#2b2622;--muted:#8b8279;--card:#fffdf9;--line:#e4dcd0;--accent:#a8483f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Noto Sans SC","Helvetica Neue",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;margin:0;font-size:15px;font-weight:600;letter-spacing:.5px;white-space:nowrap}
header h1 small{font-weight:400;color:var(--muted);margin-left:6px;font-size:11px}
@media(max-width:420px){header h1 small{display:none}}
.ib{white-space:nowrap;flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);height:34px;min-width:34px;padding:0 10px;border-radius:9px;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.ib:active{background:#f1ece4}
.ib[disabled]{opacity:.35}
.ib.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
#stage{flex:1;min-height:120px;position:relative;overflow:hidden;touch-action:none;background:#e4ded4;cursor:crosshair}
#stage.move{cursor:grab}
#world{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 2px 18px rgba(60,40,20,.18);will-change:transform}
#world canvas{position:absolute;left:0;top:0;display:block}
#hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(43,38,34,.82);color:#fff;font-size:12px;padding:7px 12px;border-radius:20px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#e4ded4;color:var(--muted);font-size:13px;z-index:5}
#panel{flex:none;background:var(--card);border-top:1px solid var(--line);padding:6px 0 max(8px,env(safe-area-inset-bottom));position:relative}
.row{display:flex;gap:7px;padding:3px 10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}
.tabs{align-items:center}
.tab{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;height:34px;font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#fold{flex:none;width:34px;height:34px;border:none;background:none;font-size:16px;color:var(--muted);cursor:pointer}
.chip{flex:none;width:58px;border:1.5px solid transparent;background:none;padding:2px;border-radius:11px;cursor:pointer;color:var(--ink);font-size:11px;text-align:center}
.chip canvas{display:block;width:52px;height:42px;border-radius:8px;border:1px solid var(--line);background:#fff}
.chip span{display:block;margin-top:3px;line-height:1}
.chip.on{border-color:var(--accent)}
.colors{align-items:center;padding-top:5px;padding-bottom:5px}
.sw{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2.5px var(--accent)}
.pick{flex:none;position:relative;width:28px;height:28px;border-radius:50%;background:conic-gradient(#e44,#ea3,#4c5,#3ad,#94e,#e44);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.pick input{position:absolute;inset:-6px;width:44px;height:44px;opacity:0;cursor:pointer}
.sliders{gap:14px;align-items:center;font-size:12px;color:var(--muted)}
.sliders label{display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none}
.sliders input[type=range]{width:96px;accent-color:var(--accent)}
.sliders .lock{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:12px;color:var(--ink);cursor:pointer;flex:none}
.sliders .lock.on{background:#f4e6e3;border-color:var(--accent);color:var(--accent)}
.collapsed .fold-me{display:none}
#gown{position:fixed;inset:0;background:rgba(30,24,20,.6);display:none;z-index:15;align-items:flex-end;justify-content:center}
#gown.on{display:flex}
.gbox{background:var(--card);width:100%;max-width:760px;max-height:82%;border-radius:16px 16px 0 0;padding:12px 12px 16px;display:flex;flex-direction:column;gap:8px}
.gh{display:flex;align-items:center;justify-content:space-between}
#gownGrid{overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;-webkit-overflow-scrolling:touch}
.gi{border:1px solid var(--line);background:#fbf8f2;border-radius:10px;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink);cursor:pointer}
.gi img{height:120px;width:auto;max-width:100%;object-fit:contain}
.gi.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.gbox p{margin:0;font-size:11px;color:var(--muted)}
#modal{position:fixed;inset:0;background:rgba(30,24,20,.72);display:none;align-items:center;justify-content:center;z-index:20;flex-direction:column;gap:12px;padding:16px}
#modal.on{display:flex}
#modal img{max-width:100%;max-height:74%;background:#fff;border-radius:6px;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default}
#modal p{margin:0;color:#fff;font-size:13px}

.cats{padding-top:2px;padding-bottom:2px}
.cat{flex:none;border:1px solid var(--line);background:#fff;border-radius:14px;height:26px;padding:0 11px;font-size:12px;color:var(--ink);cursor:pointer;white-space:nowrap}
.cat.on{background:#f4e6e3;border-color:var(--accent);color:var(--accent)}
.chip span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;margin-top:3px;line-height:1.2;overflow:hidden;font-size:10.5px;height:2.4em;word-break:break-all}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{border:none;background:#fff;padding:5px 10px;font-size:12px;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
#busy{position:absolute;right:10px;top:10px;background:rgba(43,38,34,.82);color:#fff;font-size:12px;padding:6px 11px;border-radius:16px;pointer-events:none;display:none;z-index:4}
.sliders b{font-weight:500;color:#2b2622;min-width:34px;display:inline-block}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>服装设计填色<small>面料 · 蕾丝 · 皮草</small></h1>
    <button class="ib" id="bGown">底图</button>
    <button class="ib" id="bUndo" title="撤销" disabled>↶</button>
    <button class="ib" id="bRedo" title="重做" disabled>↷</button>
    <button class="ib" id="bView" title="视图">全身</button>
    <button class="ib pri" id="bSave">保存</button>
  </header>
  <div id="stage">
    <div id="world"></div>
    <div id="hint">按住看高亮范围 · 松手填充 · 拖动可换区域 · 双指缩放</div>
    <div id="busy">载入纹理…</div>
    <div id="loading">载入线稿中…</div>
  </div>
  <div id="panel">
    <div class="row tabs" id="tools">
      <button class="tab on" data-t="fill">填充</button>
      <button class="tab" data-t="clear">清除</button>
      <button class="tab" data-t="move">移动</button>
      <button id="fold" title="收起">⌄</button>
    </div>
    <div class="fold-me">
      <div class="row cats" id="cats"></div>
      <div class="row" id="chips"></div>
      <div class="row colors" id="colors"></div>
      <div class="row sliders" id="sliders"></div>
    </div>
  </div>
</div>
<div id="gown"><div class="gbox"><div class="gh"><b>选底图</b><button id="gownClose" class="ib">关闭</button></div><div id="gownGrid"></div><p>切换后各底图的上色会暂时保留（最近 6 张），刷新页面则清空，记得先保存</p></div></div>
<div id="modal"><img id="outImg" alt=""><p>长按图片即可保存 · 点空白处关闭</p></div>

function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('载入失败 '+src));i.src=src})}
let busyN=0;const busy=$('#busy');
function busyOn(){busyN++;busy.style.display='block'}function busyOff(){busyN=Math.max(0,busyN-1);if(!busyN)busy.style.display='none'}
function ensureMat(m){if(m.img)return Promise.resolve(m);if(!m._p){busyOn();m._p=loadImage(m.file).then(i=>{m.img=i;busyOff();return m}).catch(e=>{busyOff();m._p=null;throw e})}return m._p}

/* 逐级缩小，避免细纹理走样 */
function resizeTo(src,w,h){let cw=src.naturalWidth||src.width,ch=src.naturalHeight||src.height,cur=src;
  while(cw/2>=w&&ch/2>=h){const t=mk(Math.ceil(cw/2),Math.ceil(ch/2)),x=t.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(cur,0,0,t.width,t.height);cur=t;cw=t.width;ch=t.height}
  const o=mk(w,h),ox=o.getContext('2d');ox.imageSmoothingQuality='high';ox.drawImage(cur,0,0,w,h);return o}
function grayOf(cv){const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data;return d}

const tileCache=new Map();
function cacheSet(k,v){tileCache.set(k,v);if(tileCache.size>12)tileCache.delete(tileCache.keys().next().value)}
/* 把灰度纹理染成颜色：tone=明暗叠加（面料），alpha=颜色+透明度（蕾丝） */
function colorize(gray,w,h,m,col,str){const out=mk(w,h),x=out.getContext('2d'),id=x.createImageData(w,h),o=id.data,N=w*h;
  if(m.type==='tone'){let s=0,s2=0;for(let i=0;i<N;i++){const g=gray[i*4];s+=g;s2+=g*g}const mean=s/N,std=Math.sqrt(Math.max(1,s2/N-mean*mean)),A=.55*str/100,den=std*2.2+4;
    for(let i=0;i<N;i++){let f=clamp((gray[i*4]-mean)/den,-1.4,1.4)*A,j=i*4;
      if(f<0){const k=1+f;o[j]=col[0]*k;o[j+1]=col[1]*k;o[j+2]=col[2]*k}else{const k=f*.85;o[j]=col[0]+(255-col[0])*k;o[j+1]=col[1]+(255-col[1])*k;o[j+2]=col[2]+(255-col[2])*k}o[j+3]=255}}
  else{const k=Math.max(.2,1+(str-100)/60+(m.con||0)*2);
    for(let i=0;i<N;i++){let a=gray[i*4]/255;if(m.inv)a=1-a;a=clamp((a-.5)*k+.5,0,1);const j=i*4;o[j]=col[0];o[j+1]=col[1];o[j+2]=col[2];o[j+3]=a*255}}
  x.putImageData(id,0,0);return out}
function tileFor(m,hex,scalePct,strPct){const iw=m.img.naturalWidth,ih=m.img.naturalHeight,disp=clamp(m.tw*scalePct/100,40,1100),Rw=Math.round(disp),Rh=Math.max(8,Math.round(disp*ih/iw));
  const key=[m.id,hex,Rw,strPct].join('|');let t=tileCache.get(key);if(t)return t;
  const rs=resizeTo(m.img,Rw,Rh);t=colorize(grayOf(rs),Rw,Rh,m,h2r(hex),strPct);cacheSet(key,t);return t}
function textureLayer(m,bb){const t=mk(bb.w,bb.h),c=t.getContext('2d'),tile=tileFor(m,state.color,state.scale,state.str);
  c.translate(-bb.x,-bb.y);const pat=c.createPattern(tile,'repeat');if(state.rot%360){try{pat.setTransform(new DOMMatrix().rotate(0,0,state.rot))}catch(_){}}
  c.fillStyle=pat;c.fillRect(bb.x,bb.y,bb.w,bb.h);c.setTransform(1,0,0,1,0,0);return t}

/* 笔头精灵（皮毛/纱）：灰度形状→带颜色的透明图 */
const spriteCache=new Map();
function spriteSet(m,hex,size){const B=[64,96,128,192,256,384,512].find(b=>b>=size*1.05)||512,nv=(m.ltj>.02||m.hj>.02)?5:1,key=[m.id,hex,B,nv].join('|');let s=spriteCache.get(key);if(s)return s;
  const rs=resizeTo(m.img,B,B),g=grayOf(rs),N=B*B,base=h2r(hex);s=[];
  for(let v=0;v<nv;v++){let col=base;if(nv>1){const l=(v/(nv-1)-.5)*2*m.ltj*1.6;col=l<0?mixc(base,BLK,-l):mixc(base,WHT,l);if(m.hj>.02)col=hueShift(col,(v/(nv-1)-.5)*m.hj*360)}
    const c=mk(B,B),x=c.getContext('2d'),id=x.createImageData(B,B),o=id.data;for(let i=0;i<N;i++){const j=i*4;o[j]=col[0];o[j+1]=col[1];o[j+2]=col[2];o[j+3]=Math.min(255,g[j]*m.gain)}x.putImageData(id,0,0);s.push(c)}
  spriteCache.set(key,s);if(spriteCache.size>8)spriteCache.delete(spriteCache.keys().next().value);return s}

/* ================= 画布与图层 ================= */
let L,DT,bbox,bgLabel,nLabels;
const world=$('#world'),stage=$('#stage');
const paper=mk(W,H),lines=mk(W,H),layers={};
['base','decor'].forEach(n=>{const c=mk(W,H);layers[n]={c,ctx:c.getContext('2d')}});
const hl=mk(W,H);hl.style.pointerEvents='none';
[paper,layers.base.c,layers.decor.c,lines,hl].forEach(c=>world.appendChild(c));
function setSize(w,h){W=w;H=h;for(const c of[paper,layers.base.c,layers.decor.c,lines,hl]){c.width=w;c.height=h;c.style.width=w+'px';c.style.height=h+'px'}world.style.width=w+'px';world.style.height=h+'px'}

function mulberry(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function drawPaper(){const x=paper.getContext('2d'),r=mulberry(99);x.fillStyle='#fbf8f2';x.fillRect(0,0,W,H);
  const id=x.getImageData(0,0,W,H),d=id.data;for(let i=0;i<d.length;i+=4){const n=(r()-.5)*7;d[i]+=n;d[i+1]+=n;d[i+2]+=n*1.1}x.putImageData(id,0,0);
  x.globalAlpha=.05;x.strokeStyle='#8a7a66';x.lineWidth=.6;for(let i=0;i<500;i++){const px=r()*W,py=r()*H,a=r()*6.28,l=4+r()*12;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke()}x.globalAlpha=1}
function computeDT(alpha){const N=W*H,d=new Float32Array(N);for(let i=0;i<N;i++)d[i]=alpha[i*4+3]>110?0:1e6;const a=1,b=1.4142;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;let v=d[i];if(v===0)continue;if(x>0)v=Math.min(v,d[i-1]+a);if(y>0){v=Math.min(v,d[i-W]+a);if(x>0)v=Math.min(v,d[i-W-1]+b);if(x<W-1)v=Math.min(v,d[i-W+1]+b)}d[i]=v}
  for(let y=H-1;y>=0;y--)for(let x=W-1;x>=0;x--){const i=y*W+x;let v=d[i];if(v===0)continue;if(x<W-1)v=Math.min(v,d[i+1]+a);if(y<H-1){v=Math.min(v,d[i+W]+a);if(x<W-1)v=Math.min(v,d[i+W+1]+b);if(x>0)v=Math.min(v,d[i+W-1]+b)}d[i]=v}
  return d}
const maskCache=new Map();
function getMask(label){let m=maskCache.get(label);if(m){maskCache.delete(label);maskCache.set(label,m);return m}
  const bb=bbox[label],c=mk(bb.w,bb.h),x=c.getContext('2d'),id=x.createImageData(bb.w,bb.h),d=id.data;
  for(let y=0;y<bb.h;y++){let o=(bb.y+y)*W+bb.x,j=y*bb.w*4+3;for(let xx=0;xx<bb.w;xx++,o++,j+=4)if(L[o]===label)d[j]=255}
  x.putImageData(id,0,0);maskCache.set(label,c);if(maskCache.size>8)maskCache.delete(maskCache.keys().next().value);return c}
function shadeCanvas(bb,k){const c=mk(bb.w,bb.h),x=c.getContext('2d'),id=x.createImageData(bb.w,bb.h),d=id.data,R1=11,R2=46;
  for(let y=0;y<bb.h;y++){let o=(bb.y+y)*W+bb.x,j=y*bb.w*4;for(let xx=0;xx<bb.w;xx++,o++,j+=4){const dv=DT[o],t1=Math.max(0,1-dv/R1),t2=Math.max(0,1-dv/R2);const s=Math.min(.78,(.40*t1*t1+.14*t2*t2)*k);
    d[j]=255*(1-s);d[j+1]=255*(1-s*1.04);d[j+2]=255*(1-s*1.1);d[j+3]=255}}
  x.putImageData(id,0,0);return c}

/* ---- 撤销（多图层） ---- */
const hist=[];let hpos=0;
function pushHist(rect,items){hist.length=hpos;hist.push({x:rect.x,y:rect.y,w:rect.w,h:rect.h,items});if(hist.length>8)hist.shift();hpos=hist.length;syncUndo()}
function undo(){if(hpos<=0)return;const e=hist[--hpos];for(const it of e.items){const c=layers[it.layer].ctx;if(!it.after)it.after=c.getImageData(e.x,e.y,e.w,e.h);c.putImageData(it.before,e.x,e.y)}syncUndo()}
function redo(){if(hpos>=hist.length)return;const e=hist[hpos++];for(const it of e.items)layers[it.layer].ctx.putImageData(it.after,e.x,e.y);syncUndo()}
function syncUndo(){$('#bUndo').disabled=hpos<=0;$('#bRedo').disabled=hpos>=hist.length}

/* ---- 点选填充 ---- */
async function fillRegion(label){const m=curMat();if(!m)return;
  try{await ensureMat(m)}catch(e){return}
  if(m.type==='stamp')return fillStamp(label,m);
  const bb=bbox[label],mask=getMask(label),layer=m.type==='tone'?'base':'decor',ctx=layers[layer].ctx;
  pushHist(bb,[{layer,before:ctx.getImageData(bb.x,bb.y,bb.w,bb.h)}]);
  const tex=textureLayer(m,bb),c=tex.getContext('2d');
  if(m.type==='tone'&&state.shade>0&&label!==bgLabel){c.globalCompositeOperation='multiply';c.drawImage(shadeCanvas(bb,state.shade/100*1.15),0,0)}
  c.globalCompositeOperation='destination-in';c.drawImage(mask,0,0);
  ctx.save();ctx.globalCompositeOperation='destination-out';ctx.drawImage(mask,bb.x,bb.y);ctx.restore();
  ctx.save();ctx.globalAlpha=state.op/100;ctx.drawImage(tex,bb.x,bb.y);ctx.restore()}
function clearRegion(label){const bb=bbox[label],mask=getMask(label),names=state.erase==='all'?['base','decor']:['decor'];
  pushHist(bb,names.map(n=>({layer:n,before:layers[n].ctx.getImageData(bb.x,bb.y,bb.w,bb.h)})));
  for(const n of names){const c=layers[n].ctx;c.save();c.globalCompositeOperation='destination-out';c.drawImage(mask,bb.x,bb.y);c.restore()}}

/* ---- 毛绒/纱：整块自动铺（顺着方向，裁在区域内） ---- */
function fillStamp(label,m){
  const bb=bbox[label],mask=getMask(label),ctx=layers.decor.ctx,size=state.size,sprites=spriteSet(m,state.color,size*1.3),
    rnd=mulberry((Date.now()^label*977)&0x7fffffff),fl=state.flow*Math.PI/180,fx=Math.cos(fl),fy=Math.sin(fl),px=-fy,py=fx,
    gauze=m.cat==='gauze',dens=state.dens/100;
  const items=[{layer:'decor',before:ctx.getImageData(bb.x,bb.y,bb.w,bb.h)}];
  const under=state.under;if(under)items.push({layer:'base',before:layers.base.ctx.getImageData(bb.x,bb.y,bb.w,bb.h)});
  pushHist(bb,items);
  const t=mk(bb.w,bb.h),c=t.getContext('2d'),cx=bb.x+bb.w/2,cy=bb.y+bb.h/2,half=Math.hypot(bb.w,bb.h)/2+size;
  const pts=[],inR=(x,y)=>{x|=0;y|=0;return x>=0&&y>=0&&x<W&&y<H&&L[y*W+x]===label};
  const near=(x,y)=>{const r=size*.3;return inR(x,y)||inR(x+r,y)||inR(x-r,y)||inR(x,y+r)||inR(x,y-r)};
  const MAXN=5200;
  if(gauze){const gap=size*.75/dens,step=Math.max(6,size*.22);
    for(let u=-half;u<=half;u+=gap){const ph=rnd()*6.28,amp=size*(.25+rnd()*.5),fr=.004+rnd()*.006;
      for(let v=-half;v<=half;v+=step){const off=Math.sin(v*fr*6.28+ph)*amp,dv=Math.cos(v*fr*6.28+ph)*amp*fr*6.28;
        const x=cx+px*(u+off)+fx*v,y=cy+py*(u+off)+fy*v;if(!near(x,y))continue;pts.push({x,y,a:Math.atan2(fy+px*dv,fx+py*dv),k:v})}}}
  else{const g=Math.max(5,Math.max(m.sp,.12)*size*1.7/dens);
    for(let u=-half;u<=half;u+=g)for(let v=-half;v<=half;v+=g){const jx=(rnd()-.5)*g*1.1,jy=(rnd()-.5)*g*1.1,x=cx+px*(u+jx)+fx*(v+jy),y=cy+py*(u+jx)+fy*(v+jy);
      if(!near(x,y))continue;pts.push({x,y,a:Math.atan2(fy,fx)+(rnd()-.5)*(m.rt>0?.8:.35),k:v+jy})}}
  if(pts.length>MAXN){const keep=MAXN/pts.length;for(let i=pts.length-1;i>=0;i--)if(rnd()>keep)pts.splice(i,1)}
  pts.sort((a,b)=>a.k-b.k);
  c.translate(-bb.x,-bb.y);
  for(const p of pts){const sz=size*(1+(rnd()-.5)*2*m.szj),spr=sprites[Math.floor(rnd()*sprites.length)];
    c.save();c.translate(p.x,p.y);c.rotate(p.a+(gauze?0:1.5708));c.globalAlpha=1-rnd()*m.opj;c.drawImage(spr,-sz/2,-sz/2,sz,sz);c.restore()}
  c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='destination-in';c.drawImage(mask,0,0);
  if(under){const b=layers.base.ctx,col=mixc(h2r(state.color),BLK,.3);b.save();b.globalCompositeOperation='destination-out';b.drawImage(mask,bb.x,bb.y);b.globalCompositeOperation='source-over';
    const u=mk(bb.w,bb.h),uc=u.getContext('2d');uc.fillStyle=css(col);uc.fillRect(0,0,bb.w,bb.h);uc.globalCompositeOperation='destination-in';uc.drawImage(mask,0,0);b.drawImage(u,bb.x,bb.y);b.restore()}
  ctx.save();ctx.globalCompositeOperation='destination-out';ctx.drawImage(mask,bb.x,bb.y);ctx.restore();
  ctx.save();ctx.globalAlpha=state.op/100;ctx.drawImage(t,bb.x,bb.y);ctx.restore()}

function showHL(label){if(label===hlLabel)return;hlLabel=label;const x=hl.getContext('2d');x.clearRect(0,0,W,H);if(!label)return;
  const bb=bbox[label];x.drawImage(getMask(label),bb.x,bb.y);x.globalCompositeOperation='source-in';x.fillStyle=state.tool==='clear'?'rgba(60,60,60,.35)':'rgba(255,70,120,.38)';x.fillRect(bb.x,bb.y,bb.w,bb.h);x.globalCompositeOperation='source-over';

/* ================= 视图/手势 ================= */
const view={s:1,tx:0,ty:0,mode:'width'};
function applyView(){world.style.transform=`translate(${view.tx}px,${view.ty}px) scale(${view.s})`}
function fitWidth(){const r=stage.getBoundingClientRect();view.s=(r.width-20)/W;view.tx=10;view.ty=10;view.mode='width';applyView();$('#bView').textContent='全身'}
function fitAll(){const r=stage.getBoundingClientRect();view.s=(r.height-16)/H;view.tx=(r.width-W*view.s)/2;view.ty=8;view.mode='all';applyView();$('#bView').textContent='放大'}
function toWorld(cx,cy){const r=stage.getBoundingClientRect();return[(cx-r.left-view.tx)/view.s,(cy-r.top-view.ty)/view.s]}
function clampView(){const r=stage.getBoundingClientRect(),m=60,w=W*view.s,h=H*view.s;view.tx=clamp(view.tx,Math.min(m,r.width-w-m),Math.max(r.width-m,m));view.ty=clamp(view.ty,Math.min(m,r.height-h-m),Math.max(r.height-m,m))}
function zoomAt(cx,cy,ns){const r=stage.getBoundingClientRect(),px=cx-r.left,py=cy-r.top;ns=clamp(ns,.08,3.5);const wx=(px-view.tx)/view.s,wy=(py-view.ty)/view.s;view.s=ns;view.tx=px-wx*ns;view.ty=py-wy*ns;clampView();applyView()}
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,view.s*Math.exp(-e.deltaY*.0015))},{passive:false});
const ptrs=new Map();let gest=null,tap=null,panning=null;
const aiming=()=>state.tool==='fill'||state.tool==='clear';
stage.addEventListener('pointerdown',e=>{if(!L)return;try{stage.setPointerCapture(e.pointerId)}catch(_){}
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){tap=null;panning=null;showHL(0);const[a,b]=[...ptrs.values()];gest={d:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2,s:view.s,tx:view.tx,ty:view.ty};return}
  if(ptrs.size>2)return;
  const[x,y]=toWorld(e.clientX,e.clientY);tap={x:e.clientX,y:e.clientY,moved:false,wx:x,wy:y};
  if(state.tool==='move'||e.button===1){panning={x:e.clientX,y:e.clientY,tx:view.tx,ty:view.ty};stage.classList.add('move')}
  else if(aiming())showHL(labelAt(x,y));

stage.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY;
  if(gest&&ptrs.size>=2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,r=stage.getBoundingClientRect();
    const ns=clamp(gest.s*d/gest.d,.08,3.5),wx=(gest.cx-r.left-gest.tx)/gest.s,wy=(gest.cy-r.top-gest.ty)/gest.s;view.s=ns;view.tx=cx-r.left-wx*ns;view.ty=cy-r.top-wy*ns;clampView();applyView();return}
  if(!tap)return;
  if(panning){view.tx=panning.tx+(e.clientX-panning.x);view.ty=panning.ty+(e.clientY-panning.y);clampView();applyView();return}
  if(aiming()){const[x,y]=toWorld(e.clientX,e.clientY);tap.wx=x;tap.wy=y;showHL(labelAt(x,y))}});
function release(e,cancel){const had=ptrs.delete(e.pointerId);if(!had)return;
  if(gest){if(ptrs.size<2)gest=null;if(ptrs.size===0)tap=null;return}
  if(!tap)return;
  if(!cancel&&!panning&&aiming()){const label=labelAt(tap.wx,tap.wy);if(label){if(state.tool==='fill')fillRegion(label);else clearRegion(label)}}
  showHL(0);panning=null;tap=null;stage.classList.remove('move')}

let thumbT=0;
function setColor(c){state.color=c;document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s.dataset.c===c));const pk=document.querySelector('.pick input');if(pk&&/^#[0-9a-f]{6}$/i.test(c))pk.value=c;clearTimeout(thumbT);thumbT=setTimeout(drawChips,60)}

function drawChip(cv,m){const w=cv.width,h=cv.height,c=cv.getContext('2d'),at=ATL[m.cat],img=atlasImg[m.cat],col=h2r(state.color),lum=.3*col[0]+.59*col[1]+.11*col[2];
  c.fillStyle=lum>165?'#6c655f':'#ece7de';c.fillRect(0,0,w,h);if(!img)return;
  const cs=at.cell,sx=(m.cell%at.cols)*cs,sy=Math.floor(m.cell/at.cols)*cs,t=mk(cs,cs),x=t.getContext('2d');x.drawImage(img,sx,sy,cs,cs,0,0,cs,cs);
  const id=x.getImageData(0,0,cs,cs),d=id.data,N=cs*cs;
  if(m.type==='tone'){let s=0,s2=0;for(let i=0;i<N;i++){const g=d[i*4];s+=g;s2+=g*g}const mean=s/N,std=Math.sqrt(Math.max(1,s2/N-mean*mean)),den=std*2.2+4;
    for(let i=0;i<N;i++){const f=clamp((d[i*4]-mean)/den,-1.4,1.4)*.55,j=i*4;if(f<0){const k=1+f;d[j]=col[0]*k;d[j+1]=col[1]*k;d[j+2]=col[2]*k}else{const k=f*.85;d[j]=col[0]+(255-col[0])*k;d[j+1]=col[1]+(255-col[1])*k;d[j+2]=col[2]+(255-col[2])*k}d[j+3]=255}}
  else{const stamp=m.type==='stamp',gain=stamp?Math.max(1,m.gain*.8):1;
    for(let i=0;i<N;i++){const j=i*4;let a=d[j]/255;if(!stamp){if(m.inv)a=1-a;a=clamp((a-.5)*(1+(m.con||0)*2)+.5,0,1)}else a=Math.min(1,a*gain);d[j]=col[0];d[j+1]=col[1];d[j+2]=col[2];d[j+3]=a*255}}
  x.putImageData(id,0,0);const s=Math.max(w,h)/cs;c.drawImage(t,(w-cs*s)/2,(h-cs*s)/2,cs*s,cs*s)}
function drawChips(){document.querySelectorAll('#chips .chip').forEach(b=>drawChip(b.querySelector('canvas'),matById[b.dataset.id]))}
function buildCats(){const row=$('#cats');row.innerHTML='';CATS.forEach(([id,name])=>{const b=document.createElement('button');b.className='cat'+(id===state.cat?' on':'');b.dataset.c=id;b.textContent=name;row.appendChild(b)})}
function buildChips(){const row=$('#chips');row.innerHTML='';
  MATS.filter(m=>m.cat===state.cat).forEach(m=>{const b=document.createElement('button');b.className='chip'+(m.id===state.mat?' on':'');b.dataset.id=m.id;const cv=document.createElement('canvas');cv.width=104;cv.height=84;b.appendChild(cv);const sp=document.createElement('span');sp.textContent=m.name;b.appendChild(sp);row.appendChild(b)});
  drawChips();const on=row.querySelector('.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'})}
$('#cats').addEventListener('click',e=>{const b=e.target.closest('.cat');if(!b)return;state.cat=b.dataset.c;setMat(lastMat[state.cat],true)});
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b)setMat(b.dataset.id)});

function setMat(id){const m=matById[id];if(!m)return;state.mat=id;state.cat=m.cat;lastMat[m.cat]=id;
  if(m.type==='stamp')state.size=m.ds;
  state.under=false;ensureMat(m).catch(()=>{});buildCats();buildChips();syncTools();buildSliders()}
function syncTools(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.t===state.tool));
  const showMat=state.tool==='fill';$('#cats').style.display=showMat?'':'none';$('#chips').style.display=showMat?'':'none';$('#colors').style.display=showMat?'':'none';stage.style.cursor=state.tool==='move'?'grab':'crosshair'}
function setTool(t){state.tool=t;showHL(0);syncTools();buildSliders()}
$('#tools').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)setTool(b.dataset.t)});

function buildSliders(){const s=$('#sliders');s.innerHTML='';const m=curMat(),t=state.tool,stamp=m.type==='stamp',tone=m.type==='tone';
  const rng=(label,key,min,max,unit)=>{const l=document.createElement('label');l.innerHTML=`${label}<input type="range" min="${min}" max="${max}" value="${state[key]}"><b>${state[key]}${unit}</b>`;
    const inp=l.querySelector('input'),out=l.querySelector('b');inp.addEventListener('input',()=>{state[key]=+inp.value;out.textContent=inp.value+unit});s.appendChild(l)};
  const seg=()=>{const d=document.createElement('span');d.className='seg';d.innerHTML=`<button data-v="all" class="${state.erase==='all'?'on':''}">全部图层</button><button data-v="decor" class="${state.erase==='decor'?'on':''}">仅装饰层</button>`;
    d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.erase=b.dataset.v;d.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))});s.appendChild(d)};
  const under=()=>{const b=document.createElement('button');b.className='lock'+(state.under?' on':'');b.textContent=state.under?'✓ 铺底色':'铺底色';b.addEventListener('click',()=>{state.under=!state.under;b.className='lock'+(state.under?' on':'');b.textContent=state.under?'✓ 铺底色':'铺底色'});s.appendChild(b)};
  if(t==='fill'){if(stamp){rng('大小','size',20,300,'');rng('密度','dens',40,200,'%');rng('方向','flow',0,359,'°');rng('浓度','op',10,100,'%');under()}
    else{rng('纹理大小','scale',30,250,'%');rng('方向','rot',0,360,'°');rng('纹理强度','str',0,200,'%');if(tone)rng('立体感','shade',0,100,'');rng('浓度','op',10,100,'%')}}
  else if(t==='clear'){const sp=document.createElement('span');sp.textContent='点区域清除：';s.appendChild(sp);seg()}
  else{const sp=document.createElement('span');sp.textContent='拖动画面移动 · 双指缩放 · 面料在底层，蕾丝/皮草/纱在上层';s.appendChild(sp)}}

$('#fold').addEventListener('click',()=>{const p=$('#panel');p.classList.toggle('collapsed');$('#fold').textContent=p.classList.contains('collapsed')?'⌃':'⌄';setTimeout(()=>{if(view.mode==='all')fitAll()},30)});
$('#bUndo').addEventListener('click',undo);$('#bRedo').addEventListener('click',redo);
$('#bView').addEventListener('click',()=>{view.mode==='width'?fitAll():fitWidth()});
window.addEventListener('resize',()=>{view.mode==='all'?fitAll():(view.mode==='width'&&fitWidth())});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();e.shiftKey?redo():undo()}});
$('#bSave').addEventListener('click',()=>{const o=mk(W,H),x=o.getContext('2d');x.drawImage(paper,0,0);x.drawImage(layers.base.c,0,0);x.drawImage(layers.decor.c,0,0);x.drawImage(lines,0,0);
  o.toBlob(b=>{$('#outImg').src=URL.createObjectURL(b);$('#modal').classList.add('on')},'image/png')});
$('#modal').addEventListener('click',e=>{if(e.target.id!=='outImg')$('#modal').classList.remove('on')});

/* ================= 载入 / 选底图 ================= */
const stash=new Map();let curGown=null;
function stashCur(){if(!curGown)return;const mkc=src=>{const c=mk(W,H);c.getContext('2d').drawImage(src,0,0);return c};
  stash.delete(curGown);stash.set(curGown,{base:mkc(layers.base.c),decor:mkc(layers.decor.c)});if(stash.size>6)stash.delete(stash.keys().next().value)}
async function loadGown(id){const g=GOWNS.find(x=>x.id===id);if(!g)return;const ld=$('#loading');ld.textContent='载入线稿中…';ld.style.display='block';
  try{const[li,lb]=await Promise.all([loadImage('d/'+id+'_s.png'),loadImage('d/'+id+'_l.png')]);
    stashCur();setSize(g.w,g.h);maskCache.clear();hlLabel=0;hist.length=0;hpos=0;syncUndo();
    lines.getContext('2d').drawImage(li,0,0);
    const lc=mk(W,H),lx=lc.getContext('2d');lx.drawImage(lb,0,0);const d=lx.getImageData(0,0,W,H).data;L=new Uint16Array(W*H);
    nLabels=0;for(let i=0;i<W*H;i++){const v=d[i*4]|(d[i*4+1]<<8);L[i]=v;if(v>nLabels)nLabels=v}
    bbox=new Array(nLabels+1);for(let l=1;l<=nLabels;l++)bbox[l]={x0:W,y0:H,x1:-1,y1:-1};
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){const v=L[y*W+x];if(!v)continue;const b=bbox[v];if(x<b.x0)b.x0=x;if(x>b.x1)b.x1=x;if(y<b.y0)b.y0=y;if(y>b.y1)b.y1=y}
    for(let l=1;l<=nLabels;l++){const b=bbox[l];bbox[l]=b.x1<0?{x:0,y:0,w:1,h:1}:{x:b.x0,y:b.y0,w:b.x1-b.x0+1,h:b.y1-b.y0+1}}
    bgLabel=L[5*W+5];DT=computeDT(lines.getContext('2d').getImageData(0,0,W,H).data);
    drawPaper();const st=stash.get(id);if(st){layers.base.ctx.drawImage(st.base,0,0);layers.decor.ctx.drawImage(st.decor,0,0)}
    curGown=id;fitWidth();document.querySelectorAll('#gown .gi').forEach(b=>b.classList.toggle('on',b.dataset.id===id));
    ld.style.display='none';window.__ready=true}
  catch(err){ld.textContent='载入失败：'+err.message}}
function buildGowns(){const g=$('#gownGrid');g.innerHTML='';GOWNS.forEach((x,i)=>{const b=document.createElement('button');b.className='gi';b.dataset.id=x.id;b.innerHTML=`<img src="d/${x.id}_t.webp" alt=""><span>款 ${i+1}</span>`;g.appendChild(b)})}
$('#bGown').addEventListener('click',()=>$('#gown').classList.add('on'));
$('#gown').addEventListener('click',e=>{const b=e.target.closest('.gi');if(b){$('#gown').classList.remove('on');if(b.dataset.id!==curGown)loadGown(b.dataset.id)}else if(e.target.id==='gown'||e.target.closest('#gownClose'))$('#gown').classList.remove('on')});
(async()=>{
  buildColors();buildCats();buildChips();buildGowns();syncTools();buildSliders();
  const keys=Object.keys(ATL);
  Promise.all(keys.map(k=>loadImage(ATL[k].file).then(i=>{atlasImg[k]=i}).catch(()=>{}))).then(drawChips);
  ensureMat(curMat()).catch(()=>{});
  await loadGown(GOWNS[0].id)
})().catch(err=>{$('#loading').textContent='载入失败：'+err.message});
window.__dbg={fillStamp,showHL,applyView,state,get L(){return L},get bbox(){return bbox},get W(){return W},get H(){return H},loadGown,view,fillRegion,setTool,setMat,setColor,layers,get bg(){return bgLabel},ensureMat,matById};
})();
</script>
